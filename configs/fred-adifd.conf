[database]
host = 127.0.0.1
port = 5432
name = fred
user = fred
password = password
timeout = 60

[nameservice]
host = 127.0.0.1
port = 2809
context = fred

[log]
type = 2
level = 7
file = /var/log/fred-adifd.log
syslog_facility = 7

[registry]
restricted_handles = false
disable_epp_notifier = false
lock_epp_commands = true
nsset_level = 3
system_registrar = REG-SYSTEM
authinfo_length_min = 8

[adifd]
session_max = 0
session_timeout = 3600
session_garbage = 150

[messenger]
endpoint = 127.0.0.1:50052
archive = yes
archive_rendered = yes
timeout = 15

